<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teach the Robot to Dance</title>
<meta name="description" content="A classroom lab where students teach a robot to recognise dance styles they design, and see how machine learning really works.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪩%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@400;500&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#panel">Skip to workbench</a>

<div class="bgfx" aria-hidden="true">
  <span style="--x:4%;--d:19s;--dl:-2s;--s:34px">🎵</span><span style="--x:14%;--d:24s;--dl:-9s;--s:28px">⭐</span>
  <span style="--x:26%;--d:21s;--dl:-14s;--s:40px">🪩</span><span style="--x:38%;--d:27s;--dl:-5s;--s:30px">✨</span>
  <span style="--x:51%;--d:20s;--dl:-11s;--s:36px">👾</span><span style="--x:63%;--d:25s;--dl:-1s;--s:30px">🎶</span>
  <span style="--x:74%;--d:22s;--dl:-16s;--s:38px">🔥</span><span style="--x:86%;--d:26s;--dl:-7s;--s:32px">💥</span>
  <span style="--x:94%;--d:23s;--dl:-12s;--s:34px">🚀</span>
</div>

<div class="wrap">
  <header class="top">
    <div class="logo">
      <div class="logo-badge" aria-hidden="true">🤖</div>
      <h1 id="title">Teach the Robot <span>to Dance</span></h1>
    </div>
    <div class="controls">
      <div class="brainsw" id="brainsw" role="group" aria-label="Which brain to teach"></div>
      <div class="brain" id="brain"><i></i><span id="brainTxt"></span></div>
      <button class="btn primary" id="trainBtn" data-act="train">Teach the robot</button>
      <button class="btn sm" id="campBtn" data-act="camp" title="Step-by-step lessons for every feature">🎓 Training Camp</button>
      <button class="btn sm icon" id="fxBtn" aria-pressed="true" aria-label="Fun effects on or off" title="Fun effects on or off">✨</button>
      <button class="btn sm icon" id="soundBtn" data-act="sound" aria-pressed="false" aria-label="Sound" title="Sound on or off">🔇</button>
      <button class="btn sm icon" id="themeBtn" data-act="theme" aria-label="Switch light or dark" title="Light or dark">🌗</button>
    </div>
  </header>

  <div class="ticker" aria-hidden="true">
    <div class="ticker-track">
      <span>🪩 MAKE IT</span><span>🎓 TEACH IT</span><span>🔮 TEST IT</span><span>🔥 BEAT IT</span><span>🕺 DANCE!</span>
      <span>🪩 MAKE IT</span><span>🎓 TEACH IT</span><span>🔮 TEST IT</span><span>🔥 BEAT IT</span><span>🕺 DANCE!</span>
    </div>
  </div>

  <main class="studio">
    <section class="stage-col" aria-label="Robot stage and your dance">
      <div class="stage" id="stage" data-theme="club">
        <div class="scene" id="scene">
          <div class="stars"></div>
          <div class="backwall">
            <div class="led" aria-hidden="true">
              <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
              <i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i>
            </div>
          </div>
          <div class="beam b1"></div><div class="beam b2"></div>
          <div class="discoball" aria-hidden="true"><span class="cord"></span><span class="ball"></span></div>
          <div class="spk spk-l" aria-hidden="true"><i></i><i></i></div>
          <div class="spk spk-r" aria-hidden="true"><i></i><i></i></div>
          <div class="floor"></div><div class="glow" id="glow"></div>
          <svg class="rig" id="robot" viewBox="0 0 200 250" role="img" aria-label="Your dancing character"></svg>
        </div>
        <div class="bubble" id="bubble" aria-live="polite"></div>
        <div class="nametag" id="nametag"></div>
        <div class="now" id="now">Ready for a dance</div>
      </div>
      <div class="card" id="tray"></div>
    </section>

    <section aria-label="Workbench">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="panel" id="panel" tabindex="-1"></div>
    </section>
  </main>
  <footer class="foot">Everything runs in this browser tab. Nothing is uploaded and nobody can see your robot or your photos.</footer>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="coach" class="coach" hidden></div>
<div id="campOv" class="camp-ov" hidden></div>
<div id="toast" role="status" hidden></div>
<noscript><p style="padding:24px">This lab needs JavaScript. Please turn it on and reload the page.</p></noscript>

<script src="js/config.js"></script>
<script src="js/ml.js"></script>
<script src="js/moves.js"></script>
<script src="js/packs.js"></script>
<script src="js/character.js"></script>
<script src="js/app.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/fx.js"></script>
</body>
</html>
