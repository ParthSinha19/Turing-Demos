<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher | RecLab</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="bg-glow" aria-hidden="true"></div>
<main style="max-width:640px;margin:auto">
<h1 class="grad" style="font-size:2.4rem">Teacher</h1>

<div id="login" class="glass" style="padding:1.5rem">
  <label class="muted small" for="pw">Password</label>
  <div class="row" style="margin-top:.4rem">
    <input id="pw" type="password">
    <button class="btn" onclick="login()">Log in</button>
  </div>
  <p id="e1" style="color:#ffb3c0;margin-top:.6rem"></p>
</div>

<div id="panel" class="glass" style="padding:1.5rem;display:none">
  <p class="eyebrow">Classroom code</p>
  <div id="code" style="font:800 3rem ui-monospace,monospace;letter-spacing:.15em">------</div>
  <p class="muted">Students connected: <b id="count" style="color:#f3f2f8">0</b></p>
  <div class="row" style="flex-wrap:wrap;margin-top:1rem">
    <button class="btn" onclick="create()">New classroom code</button>
    <button class="btn" style="background:#20202e;box-shadow:none" onclick="joinAs()">Join as a student</button>
    <button class="btn" style="background:#20202e;box-shadow:none" onclick="endIt()">End session</button>
  </div>
  <p id="e2" style="color:#ffb3c0;margin-top:.6rem"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script>
const PASSWORD = "teacher123"; // dummy login, demo only
const $ = s => document.querySelector(s);
let code = "", off = null;

function login() {
  if ($("#pw").value !== PASSWORD) { $("#e1").textContent = "Wrong password."; return; }
  $("#login").style.display = "none"; $("#panel").style.display = "block";
}

function create() {
  if (!db) {
    $("#e2").textContent = "Firebase didn't load. Check the config and your internet connection.";
    return;
  }
  code = String(Math.floor(100000 + Math.random() * 900000));
  db.ref("classrooms/" + code).update({ createdAt: Date.now(), status: "active" })
    .then(() => {
      $("#code").textContent = code;
      $("#e2").textContent = "";
      if (off) off();
      // count students who have rated (they appear under /ratings)
      const ref = db.ref("classrooms/" + code + "/ratings");
      const f = s => $("#count").textContent = s.numChildren();
      ref.on("value", f);
      off = () => ref.off("value", f);
    })
    .catch(err => {
      console.error(err);
      $("#e2").textContent = "Live classroom sharing is temporarily unavailable.";
    });
}

function joinAs() {
  if (!code) { $("#e2").textContent = "Create a code first."; return; }
  sessionStorage.setItem("rl_student_name", "Teacher");
  sessionStorage.setItem("rl_room", code);
  location.href = "index.html?room=" + code;
}

function endIt() {
  if (code && db) db.ref("classrooms/" + code + "/status").set("ended");
  $("#code").textContent = "ENDED";
}
</script></main></body></html>
