name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('TULIP/bun.lock') }}

      # Build cluster-galaxy demo directly into its folder root
      - name: Build Cluster Galaxy
        run: |
          cd cluster-galaxy
          npm ci
          npm run build
          cp -r dist/* .

      - name: Build The Last Signal
        run: |
          cd the-last-signal
          npm ci
          npm run build
          cp -r dist/* .
          cd ..
      
      - name: Build Cosmic Quest
        run: |
          cd cosmic-quest
          npm ci
          npm run build
          cp -r dist/* .
          cd ..

      - name: Build TULIP
        run: |
          cd TULIP
          bun install --frozen-lockfile
          bun run build
          cp -r dist/client/. .
          rm -rf node_modules dist

      - name: Clean up build leftovers
        run: |
          find . -name node_modules -type d -prune -exec rm -rf {} +
          rm -rf cluster-galaxy/dist the-last-signal/dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000